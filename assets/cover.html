<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Main Thing cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonts from Google Fonts, SIL Open Font License: Bricolage Grotesque (pick), Fredoka (alternate). -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Fredoka:wght@600&display=block" rel="stylesheet">
<style>
  /* 1280 x 640 GitHub social preview. Render with render.sh (Helium headless, device scale 1).
     Alternate: open with #ember. No hash is the pick. The icon is inlined by render.sh. */
  html { margin: 0; padding: 0; background: #0b0d16; }
  body {
    margin: 0; width: 1280px; height: 640px; overflow: hidden; position: relative;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    /* Night: deep navy with violet, magenta, teal and a touch of amber, blurred in. */
    --base: #0b0d16; --base-2: #12162a;
    --g1: rgba(124, 92, 255, 0.55); --g2: rgba(236, 72, 153, 0.35); --g3: rgba(34, 211, 238, 0.28); --g4: rgba(251, 191, 36, 0.22);
    --name: #ffffff; --tag: rgba(201, 195, 255, 0.85);
    --name-font: "Bricolage Grotesque"; --name-weight: 800; --name-size: 104px; --name-tracking: -3px;
    --rim: rgba(255, 255, 255, 0.14); --halo: rgba(124, 92, 255, 0.45);
    --bar: rgba(255, 255, 255, 0.06); --bar-line: rgba(255, 255, 255, 0.08); --bar-fg: rgba(255, 255, 255, 0.85);
    background: var(--base);
  }
  body.ember {
    --base: #15100f; --base-2: #221715;
    --g1: rgba(251, 146, 60, 0.45); --g2: rgba(244, 63, 94, 0.35); --g3: rgba(168, 85, 247, 0.30); --g4: rgba(34, 211, 238, 0.16);
    --tag: rgba(255, 214, 170, 0.85); --halo: rgba(244, 63, 94, 0.35);
    --name-font: "Fredoka"; --name-weight: 600; --name-size: 108px; --name-tracking: -1px;
  }
  .desktop { position: absolute; inset: 0; background: linear-gradient(180deg, var(--base-2) 0%, var(--base) 100%); }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
  .g1 { width: 760px; height: 520px; left: -140px; top: 120px; background: var(--g1); }
  .g2 { width: 640px; height: 480px; right: -160px; top: -120px; background: var(--g2); }
  .g3 { width: 620px; height: 420px; right: 60px; bottom: -220px; background: var(--g3); }
  .g4 { width: 420px; height: 300px; left: 420px; bottom: -180px; background: var(--g4); }

  /* Menu bar, 25pt x 1.15. */
  .menubar {
    position: absolute; left: 0; right: 0; top: 0; height: 29px;
    background: var(--bar); border-bottom: 1px solid var(--bar-line);
    color: var(--bar-fg); font-size: 15px; font-weight: 500;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px 0 22px; box-sizing: border-box;
  }
  .menubar .left, .menubar .right { display: flex; align-items: center; gap: 22px; }
  .menubar .left .apple { width: 16px; height: 19px; margin-right: 2px; }
  .menubar .left .app { font-weight: 700; }
  .menubar .right { gap: 16px; }
  .menubar .right svg { display: block; }
  .menubar .clock { font-variant-numeric: tabular-nums; }

  /* The open notch, the app's numbers x1.15: card 420 wide, 8pt flares, 24pt bottom radius. */
  .notch {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 501px; /* (420 + 16) x 1.15 */
    color: #fff;
    filter: drop-shadow(0 10px 30px var(--halo)) drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
  }
  .notch svg.outline { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .notch .content {
    position: relative; box-sizing: border-box;
    padding: 31px 18px 16px 18px; /* menu bar + 2, 16, 14, x1.15 */
    display: flex; flex-direction: column; gap: 7px;
  }
  .row { position: relative; line-height: 1.25; white-space: nowrap; }
  .row span { position: relative; }
  .row.title { font-size: 17px; font-weight: 600; letter-spacing: -0.1px; }
  .row.dim { font-size: 15px; color: rgba(255, 255, 255, 0.55); }
  .row.struck span { color: rgba(255, 255, 255, 0.45); }
  .row svg.ink { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

  .brand {
    position: absolute; left: 0; right: 0; top: 292px;
    display: flex; align-items: center; justify-content: center; gap: 34px;
  }
  .brand img { width: 192px; height: 192px; display: block; }
  .brand .text { display: flex; flex-direction: column; gap: 4px; }
  .brand .name {
    font-family: var(--name-font), "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-weight: var(--name-weight);
    font-size: var(--name-size); letter-spacing: var(--name-tracking); line-height: 1; color: var(--name);
  }
  .brand .tag { font-size: 32px; font-weight: 500; letter-spacing: -0.3px; color: var(--tag); padding-left: 4px; }
</style>
</head>
<body>
  <div class="desktop"></div>
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div><div class="glow g4"></div>

  <div class="menubar">
    <div class="left">
      <svg class="apple" viewBox="0 0 17 20" fill="currentColor" aria-hidden="true"><path d="M14.1 10.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8C4.2 5.1 2.7 6 1.9 7.5.1 10.5 1.4 15 3.1 17.5c.8 1.2 1.8 2.6 3.1 2.5 1.3-.1 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.4-2.8-.1 0-2.9-1.1-2.9-4.2zM11.7 3.4c.7-.8 1.2-2 1-3.2-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.5 2.9-1.3z"/></svg>
      <span class="app">Finder</span><span>File</span><span>Edit</span><span>View</span><span>Go</span>
    </div>
    <div class="right">
      <svg width="19" height="15" viewBox="0 0 26 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2 7.5a16 16 0 0 1 22 0"/><path d="M6 11.5a10 10 0 0 1 14 0"/><path d="M10 15.5a4.5 4.5 0 0 1 6 0"/></svg>
      <svg width="28" height="15" viewBox="0 0 38 20" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="1.5" y="3" width="30" height="14" rx="4"/><rect x="4" y="5.5" width="21" height="9" rx="2" fill="currentColor" stroke="none"/><path d="M34 8v4" stroke-linecap="round"/></svg>
      <span class="clock">Thu 25 Sep&nbsp;&nbsp;9:41</span>
    </div>
  </div>

  <div class="notch">
    <svg class="outline" viewBox="0 0 501 146" preserveAspectRatio="none" aria-hidden="true">
      <!-- Flares 9.2 (8 x 1.15), bottom radius 27.6 (24 x 1.15). Static for 4 rows; the script refits it to the content. -->
      <path id="notchPath" d="M0 0 Q9.2 0 9.2 9.2 L9.2 118.4 A27.6 27.6 0 0 0 36.8 146 L464.2 146 A27.6 27.6 0 0 0 491.8 118.4 L491.8 9.2 Q491.8 0 501 0 Z" fill="#000"/>
      <path id="notchRim" d="M9.2 9.2 L9.2 118.4 A27.6 27.6 0 0 0 36.8 146 L464.2 146 A27.6 27.6 0 0 0 491.8 118.4 L491.8 9.2" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="content" id="content">
      <div class="row title"><span>Ship the launch post</span></div>
      <div class="row dim struck" id="struck"><span>Reply to the design review</span></div>
      <div class="row dim"><span>Update the changelog</span></div>
      <div class="row dim"><span>Book the offsite room</span></div>
    </div>
  </div>

  <div class="brand">
    <img id="icon" src="icon.svg" alt="">
    <div class="text">
      <div class="name">Main Thing</div>
      <div class="tag">Your main thing, in the notch.</div>
    </div>
  </div>

<script>
  // The icon, inlined by render.sh from icon.svg so the cover renders from any location.
  var ICON = "/*ICON*/data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDI0IiBoZWlnaHQ9IjEwMjQiIHZpZXdCb3g9IjAgMCAxMDI0IDEwMjQiPgogIDxkZWZzPgogICAgPGxpbmVhckdyYWRpZW50IGlkPSJ0aWxlIiB4MT0iMCIgeTE9IjAiIHgyPSIwIiB5Mj0iMSI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjOWI3YmZmIi8+PHN0b3Agb2Zmc2V0PSIwLjU1IiBzdG9wLWNvbG9yPSIjN2E1Y2ZmIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjNWQzZmUwIi8+PC9saW5lYXJHcmFkaWVudD4KICAgIDxmaWx0ZXIgaWQ9InNoYWRvdyIgeD0iLTIwJSIgeT0iLTIwJSIgd2lkdGg9IjE0MCUiIGhlaWdodD0iMTQwJSI+PGZlRHJvcFNoYWRvdyBkeD0iMCIgZHk9IjEyIiBzdGREZXZpYXRpb249IjEyIiBmbG9vZC1jb2xvcj0iIzAwMCIgZmxvb2Qtb3BhY2l0eT0iMC4zIi8+PC9maWx0ZXI+CiAgICA8Y2xpcFBhdGggaWQ9InRpbGVDbGlwIj48cGF0aCBkPSJNIDYyOS4xMiAxMDAuMDAgYyAxMDMuMjIgMCAxNTQuODMgMCAxOTQuMjUgMjAuMDkgYSAxODQuMzAgMTg0LjMwIDAgMCAxIDgwLjU0IDgwLjU0IGMgMjAuMDkgMzkuNDIgMjAuMDkgOTEuMDMgMjAuMDkgMTk0LjI1IEwgOTI0LjAwIDYyOS4xMiBjIDAgMTAzLjIyIDAgMTU0LjgzIC0yMC4wOSAxOTQuMjUgYSAxODQuMzAgMTg0LjMwIDAgMCAxIC04MC41NCA4MC41NCBjIC0zOS40MiAyMC4wOSAtOTEuMDMgMjAuMDkgLTE5NC4yNSAyMC4wOSBMIDM5NC44OCA5MjQuMDAgYyAtMTAzLjIyIDAgLTE1NC44MyAwIC0xOTQuMjUgLTIwLjA5IGEgMTg0LjMwIDE4NC4zMCAwIDAgMSAtODAuNTQgLTgwLjU0IGMgLTIwLjA5IC0zOS40MiAtMjAuMDkgLTkxLjAzIC0yMC4wOSAtMTk0LjI1IEwgMTAwLjAwIDM5NC44OCBjIDAgLTEwMy4yMiAwIC0xNTQuODMgMjAuMDkgLTE5NC4yNSBhIDE4NC4zMCAxODQuMzAgMCAwIDEgODAuNTQgLTgwLjU0IGMgMzkuNDIgLTIwLjA5IDkxLjAzIC0yMC4wOSAxOTQuMjUgLTIwLjA5IFoiLz48L2NsaXBQYXRoPgogIDwvZGVmcz4KICA8ZyBmaWx0ZXI9InVybCgjc2hhZG93KSI+PHBhdGggZD0iTSA2MjkuMTIgMTAwLjAwIGMgMTAzLjIyIDAgMTU0LjgzIDAgMTk0LjI1IDIwLjA5IGEgMTg0LjMwIDE4NC4zMCAwIDAgMSA4MC41NCA4MC41NCBjIDIwLjA5IDM5LjQyIDIwLjA5IDkxLjAzIDIwLjA5IDE5NC4yNSBMIDkyNC4wMCA2MjkuMTIgYyAwIDEwMy4yMiAwIDE1NC44MyAtMjAuMDkgMTk0LjI1IGEgMTg0LjMwIDE4NC4zMCAwIDAgMSAtODAuNTQgODAuNTQgYyAtMzkuNDIgMjAuMDkgLTkxLjAzIDIwLjA5IC0xOTQuMjUgMjAuMDkgTCAzOTQuODggOTI0LjAwIGMgLTEwMy4yMiAwIC0xNTQuODMgMCAtMTk0LjI1IC0yMC4wOSBhIDE4NC4zMCAxODQuMzAgMCAwIDEgLTgwLjU0IC04MC41NCBjIC0yMC4wOSAtMzkuNDIgLTIwLjA5IC05MS4wMyAtMjAuMDkgLTE5NC4yNSBMIDEwMC4wMCAzOTQuODggYyAwIC0xMDMuMjIgMCAtMTU0LjgzIDIwLjA5IC0xOTQuMjUgYSAxODQuMzAgMTg0LjMwIDAgMCAxIDgwLjU0IC04MC41NCBjIDM5LjQyIC0yMC4wOSA5MS4wMyAtMjAuMDkgMTk0LjI1IC0yMC4wOSBaIiBmaWxsPSJ1cmwoI3RpbGUpIi8+PC9nPgogIDxnIGNsaXAtcGF0aD0idXJsKCN0aWxlQ2xpcCkiPgogICAgCiAgICA8cGF0aCBkPSJNIDI0NC44IDM1Mi4wIFEgMjY0LjggMzUyLjAgMjY0LjggMzcyLjAgTCAyNjQuOCA2MTYuMCBBIDcyIDcyIDAgMCAwIDMzNi44IDY4OC4wIEwgNjg3LjIgNjg4LjAgQSA3MiA3MiAwIDAgMCA3NTkuMiA2MTYuMCBMIDc1OS4yIDM3Mi4wIFEgNzU5LjIgMzUyLjAgNzc5LjIgMzUyLjAgWiIgZmlsbD0iIzAwMDAwMCIvPgogICAgPHJlY3QgeD0iNDI4LjAiIHk9IjQyNi4wIiB3aWR0aD0iMTY4IiBoZWlnaHQ9IjE2OCIgcng9IjQwIiBmaWxsPSIjZmZmZmZmIi8+CiAgICA8cGF0aCBkPSJNIDQ3MCA1MTQuMCBMIDUwMiA1NDYuMCBMIDU1OCA0NzYuMCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMDAwMDAwIiBzdHJva2Utd2lkdGg9IjI0IiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz4KICA8L2c+Cjwvc3ZnPgo=/*/ICON*/";
  ICON = ICON.replace(/\/\*\/?ICON\*\//g, '');
  if (ICON.length > 30) document.getElementById('icon').src = ICON;
  // Theme from the hash, for the alternate.
  var h = location.hash.replace('#', '');
  if (h === 'ember') document.body.className = h;

  // Notch outline refit to the content height (the markup carries a static 4 row version).
  var W = 501, F = 9.2, R = 27.6;
  var H = document.getElementById('content').getBoundingClientRect().height;
  document.querySelector('.notch svg.outline').setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  var side = 'L' + F + ' ' + (H - R) + ' A' + R + ' ' + R + ' 0 0 0 ' + (F + R) + ' ' + H +
    ' L' + (W - F - R) + ' ' + H + ' A' + R + ' ' + R + ' 0 0 0 ' + (W - F) + ' ' + (H - R) + ' L' + (W - F) + ' ' + F;
  document.getElementById('notchPath').setAttribute('d', 'M0 0 Q' + F + ' 0 ' + F + ' ' + F + ' ' + side + ' Q' + (W - F) + ' 0 ' + W + ' 0 Z');
  document.getElementById('notchRim').setAttribute('d', 'M' + F + ' ' + F + ' ' + side);

  // The pen stroke, after PenStroke in the app: overshoot before and past the glyphs, a tilt
  // under a degree, a seeded wobble, thicker in the middle than at the ends. Drawn to 72 percent,
  // mid cross off. Scaled x1.15 and a little bolder so it reads in a preview.
  function splitmix(seed) { var s = seed >>> 0; return function () { s = (s + 0x9e3779b9) >>> 0; var z = s; z = Math.imul(z ^ (z >>> 16), 0x85ebca6b) >>> 0; z = Math.imul(z ^ (z >>> 13), 0xc2b2ae35) >>> 0; return ((z ^ (z >>> 16)) >>> 0) / 4294967296; }; }
  var row = document.getElementById('struck'), span = row.querySelector('span');
  var rb = row.getBoundingClientRect(), sb = span.getBoundingClientRect();
  var x0 = sb.left - rb.left - 5, x1 = sb.right - rb.left + 8;
  var yMid = sb.top - rb.top + sb.height * 0.56;
  var len = x1 - x0, n = 28, thick = 3.4, wobble = 1.1, progress = 0.72;
  var rnd = splitmix(0x5eed), waves = 1.5 + rnd() * 1.5, phase = rnd() * Math.PI * 2;
  var tilt = Math.min(Math.tan(0.8 * Math.PI / 180) * len, 1.8);
  var pts = [];
  for (var i = 0; i < n; i++) {
    var t = i / (n - 1);
    var env = Math.sin(t * Math.PI);
    var wave = Math.sin(t * Math.PI * 2 * waves + phase), grain = (rnd() - 0.5) * 0.5;
    var y = yMid + tilt * t + wobble * Math.max(-1, Math.min(1, wave + grain)) * env;
    var w = thick * (0.3 + 0.7 * Math.pow(env, 0.7));
    pts.push({ x: x0 + len * t, y: y, w: w });
  }
  var upto = Math.max(2, Math.round(n * progress));
  var upper = [], lower = [];
  for (var j = 0; j < upto; j++) { upper.push(pts[j].x + ' ' + (pts[j].y - pts[j].w / 2)); lower.unshift(pts[j].x + ' ' + (pts[j].y + pts[j].w / 2)); }
  var d = 'M' + upper.join(' L') + ' L' + lower.join(' L') + ' Z';
  var ink = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  ink.setAttribute('class', 'ink'); ink.setAttribute('width', rb.width); ink.setAttribute('height', rb.height);
  ink.innerHTML = '<path d="' + d + '" fill="#fff" stroke="#fff" stroke-width="0.6" stroke-linejoin="round"/>';
  row.appendChild(ink);
</script>
</body>
</html>
